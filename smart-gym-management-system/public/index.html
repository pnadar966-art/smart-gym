<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Gym & Fitness Management System</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="login-page">
  <div class="login-hero">
    <div class="mb-3"><i class="bi bi-heart-pulse-fill" style="font-size:36px;color:#ff6b35;"></i></div>
    <h1>Smart Gym &amp; Fitness<br>Management System</h1>
    <p class="tagline">Manage your gym. Track fitness. Improve results. A complete platform for members, trainers, workouts, attendance, payments and equipment — all in one place.</p>
    <div class="d-flex gap-4 mt-4 flex-wrap">
      <div><i class="bi bi-people-fill"></i> Member Management</div>
      <div><i class="bi bi-clipboard2-pulse-fill"></i> Workout Plans</div>
      <div><i class="bi bi-graph-up-arrow"></i> Fitness Tracking</div>
    </div>
  </div>

  <div class="login-form-panel">
    <div class="login-form-inner">
      <div class="logo-circle"><i class="bi bi-shield-lock-fill"></i></div>
      <h4 class="fw-bold mb-1" style="color:#1e3a5f;">Admin Login</h4>
      <div class="text-muted small mb-4">Sign in to manage your gym</div>

      <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 py-2" id="loginBtn">
          <span id="loginBtnText">Login</span>
        </button>
      </form>
    </div>
  </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
