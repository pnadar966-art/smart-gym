<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainers - Smart Gym Management System</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="layoutRoot"></div>

<div class="modal fade" id="trainerModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="trainerModalTitle">Add Trainer</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="trainerForm">
        <div class="modal-body">
          <input type="hidden" id="trainerId">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Full Name</label><input type="text" class="form-control" id="tName" required></div>
            <div class="col-md-3"><label class="form-label">Gender</label>
              <select class="form-select" id="tGender" required><option value="">Select</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div>
            <div class="col-md-3"><label class="form-label">Experience (yrs)</label><input type="number" min="0" class="form-control" id="tExperience" required></div>
            <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" id="tEmail" required></div>
            <div class="col-md-6"><label class="form-label">Phone</label><input type="text" class="form-control" id="tPhone" required></div>
            <div class="col-md-6"><label class="form-label">Specialization</label><input type="text" class="form-control" id="tSpecialization" required></div>
            <div class="col-md-3"><label class="form-label">Salary (₹/mo)</label><input type="number" min="0" class="form-control" id="tSalary" required></div>
            <div class="col-md-3"><label class="form-label">Joining Date</label><input type="date" class="form-control" id="tJoiningDate" required></div>
            <div class="col-md-6"><label class="form-label">Status</label>
              <select class="form-select" id="tStatus"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary-custom">Save Trainer</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="viewTrainerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Trainer Profile</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="viewTrainerBody"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/trainers.js"></script>
</body>
</html>
