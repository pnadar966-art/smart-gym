<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments - Smart Gym Management System</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="layoutRoot"></div>

<div class="modal fade" id="paymentModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="paymentModalTitle">Record Payment</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="paymentForm">
        <div class="modal-body">
          <input type="hidden" id="paymentId">
          <div class="mb-3"><label class="form-label">Member</label><select class="form-select" id="payMember" required></select></div>
          <div class="mb-3"><label class="form-label">Membership Plan</label><select class="form-select" id="payPlan" required></select></div>
          <div class="mb-3"><label class="form-label">Amount (₹)</label><input type="number" min="0" class="form-control" id="payAmount" required></div>
          <div class="mb-3"><label class="form-label">Payment Date</label><input type="date" class="form-control" id="payDate" required></div>
          <div class="mb-3"><label class="form-label">Payment Method</label>
            <select class="form-select" id="payMethod" required><option value="Cash">Cash</option><option value="UPI">UPI</option><option value="Card">Card</option><option value="Bank Transfer">Bank Transfer</option></select></div>
          <div class="mb-3"><label class="form-label">Payment Status</label>
            <select class="form-select" id="payStatus"><option value="Paid">Paid</option><option value="Pending">Pending</option><option value="Failed">Failed</option></select></div>
          <div class="alert alert-info small mb-0" id="payGatewayNote"><i class="bi bi-info-circle"></i> A transaction ID and receipt number are generated automatically. No online payment gateway is used.</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary-custom">Save Payment</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/payments.js"></script>
</body>
</html>
