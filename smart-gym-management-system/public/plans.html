<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membership Plans - Smart Gym Management System</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="layoutRoot"></div>

<div class="modal fade" id="planModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="planModalTitle">Add Membership Plan</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="planForm">
        <div class="modal-body">
          <input type="hidden" id="planId">
          <div class="mb-3"><label class="form-label">Plan Name</label><input type="text" class="form-control" id="pName" required></div>
          <div class="mb-3"><label class="form-label">Duration</label><input type="text" class="form-control" id="pDuration" placeholder="e.g. 1 Month, 3 Months" required></div>
          <div class="mb-3"><label class="form-label">Price (₹)</label><input type="number" min="0" class="form-control" id="pPrice" required></div>
          <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" id="pDescription" rows="2"></textarea></div>
          <div class="mb-3"><label class="form-label">Features (comma-separated)</label><input type="text" class="form-control" id="pFeatures" placeholder="Full gym access, Group classes, Diet guidance"></div>
          <div class="mb-3"><label class="form-label">Status</label>
            <select class="form-select" id="pStatus"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary-custom">Save Plan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/plans.js"></script>
</body>
</html>
