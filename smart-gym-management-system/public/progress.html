<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Progress - Smart Gym Management System</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="layoutRoot"></div>

<div class="modal fade" id="progressModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Log Fitness Progress</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="progressForm">
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Member</label><select class="form-select" id="prMember" required></select></div>
          <div class="mb-3"><label class="form-label">Date</label><input type="date" class="form-control" id="prDate" required></div>
          <div class="row g-2 mb-3">
            <div class="col-6"><label class="form-label">Weight (kg)</label><input type="number" step="0.1" class="form-control" id="prWeight" required></div>
            <div class="col-6"><label class="form-label">Height (cm)</label><input type="number" step="0.1" class="form-control" id="prHeight" required></div>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-4"><label class="form-label small">Chest (cm)</label><input type="number" step="0.1" class="form-control" id="prChest"></div>
            <div class="col-4"><label class="form-label small">Waist (cm)</label><input type="number" step="0.1" class="form-control" id="prWaist"></div>
            <div class="col-4"><label class="form-label small">Arms (cm)</label><input type="number" step="0.1" class="form-control" id="prArms"></div>
          </div>
          <div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" id="prNotes" rows="2"></textarea></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary-custom">Save Progress</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/progress.js"></script>
</body>
</html>
