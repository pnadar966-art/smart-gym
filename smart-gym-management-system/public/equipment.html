<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment - Smart Gym Management System</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="layoutRoot"></div>

<div class="modal fade" id="equipmentModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="equipmentModalTitle">Add Equipment</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="equipmentForm">
        <div class="modal-body">
          <input type="hidden" id="equipmentId">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Equipment Name</label><input type="text" class="form-control" id="eName" required></div>
            <div class="col-md-6"><label class="form-label">Category</label>
              <select class="form-select" id="eCategory" required><option value="Cardio">Cardio</option><option value="Strength">Strength</option><option value="Free Weights">Free Weights</option><option value="Other">Other</option></select></div>
            <div class="col-md-4"><label class="form-label">Quantity</label><input type="number" min="1" class="form-control" id="eQuantity" required></div>
            <div class="col-md-4"><label class="form-label">Purchase Date</label><input type="date" class="form-control" id="ePurchaseDate" required></div>
            <div class="col-md-4"><label class="form-label">Purchase Price (₹)</label><input type="number" min="0" class="form-control" id="ePrice" required></div>
            <div class="col-md-6"><label class="form-label">Condition</label>
              <select class="form-select" id="eCondition"><option value="New">New</option><option value="Good">Good</option><option value="Fair">Fair</option><option value="Needs Repair">Needs Repair</option></select></div>
            <div class="col-md-6"><label class="form-label">Status</label>
              <select class="form-select" id="eStatus"><option value="Available">Available</option><option value="In Use">In Use</option><option value="Maintenance Required">Maintenance Required</option><option value="Damaged">Damaged</option></select></div>
            <div class="col-md-6"><label class="form-label">Last Maintenance Date</label><input type="date" class="form-control" id="eLastMaintenance"></div>
            <div class="col-md-6"><label class="form-label">Next Maintenance Date</label><input type="date" class="form-control" id="eNextMaintenance"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary-custom">Save Equipment</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/equipment.js"></script>
</body>
</html>
